Segmentation: binary

Model:
  name: UNet
  param:
    in_channels: 3
    num_classes: 1
    base_channels: 32

Criterion:
  name: Dice
  dice_weights: 1.0

Loader:
  root: /home/irvingbadolato/Documentos/thesis/building-footprint-segmentation/data/rio/building_patches/filtered/
  image_normalizer: divide_by_255
  label_normalizer: binary_label
  augmenters:
    - horizontal_flip
    - random_rotation_90
  batch_size: 16

Metrics:
  - accuracy
  - precision
  - f1
  - recall
  - iou

Optimizer:
  name: AdamW
  lr: 1e-4

Callbacks:
  log_dir: '/home/irvingbadolato/Documentos/thesis/building-footprint-segmentation/logs/UNet_fullytrained/'
  callers:
    - TrainChkCallback
    - TimeCallback
    - TensorBoardCallback
    - TrainStateCallback
    - EarlyStoppingCallback
